<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Заявка принята</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ink: #0b0f1c;
  --panel: #141a2e;
  --line: #262e4a;
  --fg: #eef0f7;
  --muted: #9aa3bf;
  --lime: #c6ff3d;
  --violet: #8a6cff;
  --on-lime: #12162a;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--ink); color: var(--fg); font: 400 17px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
.top { padding-block: 22px; }
.logo { font: 800 16px/1 var(--display); letter-spacing: 0.02em; text-decoration: none; color: inherit; }
.logo span { color: var(--lime); }
main { flex: 1; display: grid; place-items: center; padding-block: 40px 72px; }
.card { max-width: 560px; text-align: center; display: grid; gap: 18px; justify-items: center; }
.check { width: 72px; height: 72px; border-radius: 50%; background: var(--lime); color: var(--on-lime); display: grid; place-items: center; font: 800 34px/1 var(--display); }
.eyebrow { font: 500 13px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lime); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 52px); line-height: 1.08; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; margin-top: 10px;
  background: var(--lime); color: var(--on-lime); text-decoration: none;
  font: 700 17px/1 var(--display); padding: 20px 30px; border-radius: 999px;
}
.btn:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
footer { border-top: 1px solid var(--line); padding-block: 32px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { body { font-size: 16px; } .btn { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/">вайб<span>/</span>кодинг</a></header>
  <main>
    <div class="card">
      <div class="check" aria-hidden="true">✓</div>
      <div class="eyebrow">Заявка принята</div>
      <h1 id="title">Вы записаны на мастер-класс</h1>
      <p>Мы получили вашу заявку. Скоро напишем в Telegram или на указанный номер: пришлём дату, время и ссылку на эфир.</p>
      <a class="btn" href="/">Вернуться на сайт</a>
    </div>
  </main>
  <footer>
    <span>ИП Кенжебаев</span>
    <span>Бесплатный мастер-класс по созданию приложений с ИИ</span>
  </footer>
</div>
<script>
try {
  const name = sessionStorage.getItem("lead_name");
  if (name) document.getElementById("title").textContent = name + ", вы записаны на мастер-класс";
} catch (e) {}
</script>
</body>
</html>
